<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Сравнение тарифов (синтетическая страница)</title></head>
<body>
<h1>Сравнение тарифов</h1>
<table><tr><th>Тариф</th><th>Объём</th></tr><tr><td>Семья</td><td>1 ТБ на шестерых</td></tr></table>
<form id="auto" action="/auto" method="post"><input name="a" value="1"></form>
<script>
  // a page script that tries to submit on its own; capture must block it
  setTimeout(function () { document.getElementById('auto').submit(); }, 50);
  setTimeout(function () { fetch('/beacon', {method: 'POST', body: 'x'}).catch(function () {}); }, 60);
</script>
</body></html>
