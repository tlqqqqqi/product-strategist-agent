<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стратег: запись прогона</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
  --user: #1f4e8c; --user-ink: #ffffff; --agent: #ffffff; --accent: #1f4e8c;
  --gate: #8a5a00; --gate-bg: #fff4dc; --ok: #2e7d4f; --err: #b3261e; --code: #f0eee9;
  --banner: #fdf3e1; --banner-line: #ecd6ad;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151515; --panel: #1e1e1e; --ink: #ecebe8; --muted: #a09e98; --line: #33322f;
    --user: #3d6fb3; --user-ink: #ffffff; --agent: #1e1e1e; --accent: #8fb4ea;
    --gate: #f0c060; --gate-bg: #2d2516; --ok: #6cc28d; --err: #f08a82; --code: #2a2a28;
    --banner: #2a2418; --banner-line: #4a3d22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151515; --panel: #1e1e1e; --ink: #ecebe8; --muted: #a09e98; --line: #33322f;
  --user: #3d6fb3; --user-ink: #ffffff; --agent: #1e1e1e; --accent: #8fb4ea;
  --gate: #f0c060; --gate-bg: #2d2516; --ok: #6cc28d; --err: #f08a82; --code: #2a2a28;
  --banner: #2a2418; --banner-line: #4a3d22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-x: hidden;
}
.wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }
header.banner {
  background: var(--banner); border-bottom: 1px solid var(--banner-line);
  padding: 14px 0 12px;
}
.banner h1 { font-size: 17px; margin: 0 0 4px; font-weight: 650; }
.banner p { margin: 0; color: var(--muted); font-size: 13.5px; }
.banner .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 13.5px; }
.banner .facts b { font-weight: 600; color: var(--ink); }
.controls {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.controls .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 8px; padding-bottom: 8px; }
button, select {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  min-height: 36px;
}
button:hover, select:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; min-width: 108px; }
.controls .progress { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.bar { height: 3px; background: var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
#chat { padding: 18px 0 40px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 92%; padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.agent { align-self: flex-start; background: var(--agent); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.agent p { margin: 0 0 8px; }
.msg.agent p:last-child, .msg.agent ul:last-child, .msg.agent ol:last-child { margin-bottom: 0; }
.msg.agent ul, .msg.agent ol { margin: 0 0 8px; padding-left: 22px; }
.msg.agent li.sub { margin-left: 18px; }
.msg.agent code { background: var(--code); border-radius: 4px; padding: 0 4px; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
.msg.agent a { color: var(--accent); }
.meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.user + .meta, .meta.right { align-self: flex-end; }
.who { font-size: 12px; color: var(--muted); margin-bottom: -8px; }
.who.right { align-self: flex-end; }
details.steps {
  align-self: stretch; border: 1px dashed var(--line); border-radius: 10px; background: transparent;
  font-size: 13px; color: var(--muted);
}
details.steps summary { cursor: pointer; padding: 7px 12px; list-style: none; display: flex; gap: 8px; align-items: baseline; }
details.steps summary::-webkit-details-marker { display: none; }
details.steps summary::before { content: "▸"; font-size: 11px; }
details.steps[open] summary::before { content: "▾"; }
details.steps summary .count { flex: none; }
details.steps summary .last:not(:empty)::before { content: "· "; }
details.steps summary .last { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
details.steps ol { margin: 0; padding: 0 12px 8px 12px; list-style: none; }
details.steps li { display: flex; gap: 8px; padding: 2px 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--ink); }
details.steps li .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-top: 7px; }
details.steps li.fail .dot { background: var(--err); }
details.steps li .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
details.steps li .c { flex: none; color: var(--muted); }
.gate {
  align-self: stretch; border: 1px solid var(--gate); background: var(--gate-bg); border-radius: 12px;
  padding: 10px 12px;
}
.gate .title { color: var(--gate); font-weight: 650; font-size: 13.5px; margin-bottom: 8px; }
.gate .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.gate .buttons span {
  border: 1px solid var(--gate); color: var(--gate); border-radius: 999px; padding: 5px 14px; font-size: 14px;
  background: var(--panel);
}
.gate .buttons span.pressed { background: var(--gate); color: var(--gate-bg); font-weight: 600; }
.gate .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.end { text-align: center; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 12px; }
.caret::after { content: "▍"; color: var(--muted); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.start {
  align-self: center; margin-top: 24px; text-align: center; color: var(--muted); font-size: 14px;
}
.start button { margin-top: 10px; font-size: 16px; padding: 10px 22px; }
@media (max-width: 520px) {
  body { font-size: 14.5px; }
  .msg { max-width: 100%; }
  .controls .progress { width: 100%; margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .caret::after { animation: none; } }
</style>
</head>

<header class="banner">
  <div class="wrap">
    <h1>Запись реального прогона, не живой чат</h1>

</header>
<div class="controls">

        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="max">Сразу</option>

    <button id="skip" type="button">К следующему гейту</button>
    <button id="restart" type="button">Сначала</button>
    <button id="theme" type="button" aria-label="Тема">Тема</button>
    <span class="progress" id="progress"></span>
  </div>
  <div class="bar"><i id="bar"></i></div>
</div>
<main class="wrap">
  <div id="chat" aria-live="polite"></div>
</main>

аш ответ.\n\n**Q2: сколько стоит откат до 299 ₽** — ответ есть.\n- Цена падает на 14,3%. Чтобы сохранить выручку октября (~14,1 млн ₽), месячный отток должен упасть с 6,8% до 5,83% или ниже [C025].\n- Чтобы не опуститься ниже уровня июля, нужно около 44 500 платящих. Это на 5,3% больше, чем в октябре [C026].\n- Вывод: откат окупится, только если именно цена вызывает заметную часть лишнего оттока. Без теста цены это ставка, а не расчёт [C029]. Ранжирование это не меняет: полный откат остаётся рискованным для выручки.\n\n**Q1: какая часть роста оттока из-за акции** — промежуточно.\n- Если считать нормой отток мая–июля (4,13%), то в августе–октябре лишних ушедших около 3 050 [C022].\n- Из майской акционной когорты ушло около 2 100 человек. Этого хватает, чтобы объяснить бо́льшую часть роста [C028].\n- Но цифры не сходятся. Если бы все 2 100 ушли при первом списании в августе, это был бы 81% всего оттока августа. Такого быть не может, ведь давние клиенты тоже уходят [C023].\n\n**Нужен ваш ответ.** Сумма по каналам на листе `cohorts` (41 200) в точности равна числу платящих в мае [C024]. Поэтому прошу уточнить [C027]:\n1. На листе `cohorts` пришедшие в мае или вся база на май, разбитая по каналам привлечения?\n2. `churn_month3_pct` для акционных — это уход при первом списании в августе или за все три месяца, включая бесплатные?\n\nЕсли точных ответов нет, скажите. Тогда я оценю вклад акции диапазоном по обоим прочтениям и запишу это как пробел.\n\nQ3 тоже зависит от этого ответа, поэтому пока жду. Q4 (тарифы других облачных хранилищ) и Q5 (удержание после бесплатного периода) — веб-поиск примерно на $0,04 из бюджета $5. Его могу начать параллельно, если скажете.\n\nРасчёты лежат в `cases/family-price/analysis/` (q1, q2), их результаты зарегистрированы как источники S004 и S005. Бюджет пока не тронут.", "usd": 0.0307, "t": 717}, {"kind": "user", "text": "Точного смысла листа cohorts я не знаю, это выгрузка аналитика. Оцените вклад акции диапазоном по обоим прочтениям и за изменил plan.md", "ok": true, "t": 897}, {"kind": "step", "tool": "Edit", "line": "изменил plan.md", "ok": true, "t": 899}, {"kind": "step", "tool": "Edit", "line": "изменил plan.md", "ok": true, "t": 903}, {"kind": "step", "tool": "Bash", "line": "bin/strat step research.done --out plan.md --next \"Options: final options, objections, rec…\"", "ok": true, "usd": 0.0359, "t": 906}, {"kind": "agent", "text": "Исследование завершено. Переписываю варианты на новых данных: возражения, вердикты, рекомендация.", "usd": 0.0823, "t": 907}, {"kind": "step", "tool": "Write", "line": "записал options.md", "ok": true, "t": 931}, {"kind": "step", "tool": "Bash", "line": "bin/strat step options.final --out options.md --next \"Gate 2: run gate check 2 and present\"", "ok": false, "t": 932}, {"kind": "step", "tool": "Bash", "line": "bin/strat gate check 2", "ok": false, "t": 933}, {"kind": "step", "tool": "Edit", "line": "изменил options.md", "ok": true, "usd": 0.0588, "t": 937}, {"kind": "step", "tool": "Bash", "line": "bin/strat step options.final --out options.md --next \"Gate 2: present and wait for the user's…\"", "ok": true, "t": 938}, {"kind": "step", "tool": "Bash", "line": "bin/strat gate check 2", "ok": true, "t": 939}, {"kind": "step", "tool": "Bash", "line": "bin/strat claim list --load-bearing", "ok": true, "t": 939}, {"kind": "agent", "text": "Исследование закончено, проверка второго гейта пройдена. Я рекомендую не откатывать цену, а перестроить акцию «3 месяца бесплатно». Решение за вами: выберите вариант, и я перейду к стратегии.\n\n**Картина**\n- Отток платящих вырос с 4,0–4,3% в июне–июле до 6,8% в октябре. Это около 3 050 лишних ушедших за август–октябрь [C010, C022].\n- Вклад акции посчитан диапазоном для обоих прочтений листа `cohorts`. Одна майская акционная когорта объясняет от 19% до 56% лишнего оттока [C030]. Когорты июня–августа оценить нельзя, поэтому общий вклад акции может быть выше. Это записано как пробел [C031].\n- Ушедшие чаще называют конец бесплатного периода (38%), чем цену (27%) [C008].\n- Резкий отток после бесплатного периода у подписок обычен: в данных Piano уходит около 38% [C034]. Но эти данные 2021 года и про медиаподписки, так что сравнение грубое.\n- Выручка в октябре примерно на 11% выше июля, но число платящих снижается третий месяц подряд [C018, C012].\n- 349 ₽ дороже рынка: у ОблакоПлюс 299 ₽, у Яндекс 360 «Для семьи» 300 ₽ [C038].\n- Откат до 299 ₽ окупится, только если отток упадёт с 6,8% до 5,83% и ниже [C029].\n\n**Варианты: сильнейшее возражение и вердикт**\n1. **Оставить как есть.** Акция идёт без перерыва, поэтому всплески оттока будут повторяться, а база уже сокращается. Возражение принято.\n2. **Закрыть акцию.** Майская акционная когорта оставляет около 7 700 платящих, это примерно 18% базы. Закрытие отрежет этот приток [C032]. Возражение принято, вариант отклонён.\n3. **Полный откат до 299 ₽.** Что главная причина — цена, не доказано, а выручка сразу падает на 14,3% [C036, C025]. Возражение принято, вариант отклонён.\n4. **Раздельная цена (давним 299 ₽) плюс удерживающее предложение.** Снизит ли старая цена отток давних клиентов, неизвестно ни по нашим, ни по открытым данным [C041]. **Возражение остаётся открытым**, ответ даст только тест.\n5. **Перестроить акцию: короткий пробный период, мягкий переход на оплату.** Возражение: 21% ушедших просто «не пользуются», им формат пробного периода не поможет. Отклоняю его: это отдельная причина, её не лечит ни один ценовой вариант. А длина пробного периода на удержание влияет [C035].\n\n**Что изменило ранжирование:** расчёт вклада акции (Q1) ослабил откат и усилил перестройку акции. Расчёт по притоку от акции (Q3) опустил её закрытие. Сравнение с рынком (Q4) — довод за снижение цены для новых клиентов.\n\n**Рекомендация: вариант 5.** Цену 349 ₽ оставить, акцию перестроить [C030, C037, C040]. Выручка выше июля, так что спешить с откатом не нужно.\n\n**Что изменило бы рекомендацию**\n- Если выгрузка аналитика по оттоку «акционные / неакционные» покажет заметный рост оттока неакционных, тестируем вариант 4.\n- Если после перестройки акции отток не вернётся к прежнему уровню, а доля ответов «дорого» вырастет, возвращаемся к вариантам 3 или 4.\n- Если выручка опустится ниже июля, пересматриваем решение сразу.\n\n**Пробелы и оговорки**\n- Точный смысл листа `cohorts` неизвестен [C027].\n- Актуальных цен Google One, iCloud+ и Облака Mail на семейные 2 ТБ нет. Найденные сравнения устарели: одно — декабрь 2024 года, у другого нет даты. В расчёт я их не брал [C039].\n- Отдельной модели-оппонента в этой версии нет, возражения писал я сам.\n- Попыток источников давать инструкции ИИ я не заметил.\n\n**Стоимость:** ключа поиска для CLI нет, поэтому искал встроенным веб-поиском IDE. Платных вызовов CLI — $0 из $5; токены IDE покажет `bin/strat cost`.\n\nКакой вариант выбираете? Переходим к продуктовой и коммуникационной стратегии?\n\nИсточники:\n- [Яндекс 360 — тарифы](https://360.yandex.ru/premium-plans/)\n- [RevenueCat — длина пробного периода](https://www.revenuecat.com/blog/growth/free-trial-length)\n- [FIPP / Piano — удержание и отток](https://www.fipp.com/?p=27534)\n- [Hi-Tech Mail — обзор облаков (декабрь 2024, не использован)](https://hi-tech.mail.ru/review/62638-besplatnoe-oblako/)\n- [Rozetked — сравнение цен (без даты, не использован)](https://rozetked.me/articles/22883-sravnenie-skol-ko-stoit-prostranstvo-v-oblachnyh-hranilischah)", "usd": 0.0891, "gate": {"n": 2, "buttons": ["Да, утверждаю", "Нужны правки"], "typed": true, "chosen": 0}, "t": 958}, {"kind": "user", "text": "Выбираю вариант 5, согласен с рекомендацией. Да, переходите к стратегии.", "t": 1175}, {"kind": "agent", "text": "Вариант 5 выбран, второй гейт утверждаю. Перехожу к стратегии.", "usd": 0.0757, "t": 1178}, {"kind": "step", "tool": "Bash", "line": "bin/strat gate approve 2", "ok": true, "t": 1178}, {"kind": "step", "tool": "Read", "line": "прочитал skills/strategy/SKILL.md", "ok": true, "t": 1179}, {"kind": "step", "tool": "Read", "line": ресматриваем решение.\n\nПодписываете стратегию? После подписи я запишу решение и подготовлю записку для директора по продукту.", "usd": 0.0511, "gate": {"n": 3, "buttons": ["Да, утверждаю", "Нужны правки"], "typed": true, "chosen": 0}, "t": 1285}, {"kind": "user", "text": "Подписываю.", "t": 1298}, {"kind": "step", "tool": "Bash", "line": "bin/strat gate approve 3", "ok": true, "usd": 0.0693, "t": 1300}, {"kind": "step", "tool": "Read", "line": "прочитал knowledge/templates/decision-record.md", "ok": true, "t": 1302}, {"kind": "step", "tool": "Read", "line": "прочитал knowledge/templates/memo.md", "ok": true, "t": 1303}, {"kind": "agent", "text": "Подпись записана. Пишу журнал решения и записку.", "usd": 0.1242, "t": 1305}, {"kind": "step", "tool": "Write", "line": "записал decisions.md", "ok": true, "t": 1312}, {"kind": "step", "tool": "Bash", "line": "bin/strat step signoff.decision --out decisions.md --next \"Write the memo (memo.md)\"", "ok": true, "t": 1313}, {"kind": "step", "tool": "Write", "line": "записал memo.md", "ok": true, "t": 1323}, {"kind": "step", "tool": "Bash", "line": "bin/strat step signoff.memo --out memo.md --next \"Monitoring: review the decision on its…\"", "ok": true, "t": 1324}, {"kind": "step", "tool": "Bash", "line": "bin/strat cost", "ok": true, "t": 1325}, {"kind": "agent", "text": "Стратегия подписана, решение записано, записка для директора по продукту готова. Кейс перешёл в стадию наблюдения.\n\n**Решение:** цену «Семьи» не откатываем. Акцию «3 месяца бесплатно» перестраиваем через тест трёх групп новых пользователей с декабря 2026 года. Владелец — руководитель продукта.\n\n**Даты проверки:**\n- **28 февраля 2027** — промежуточная точка.\n- **30 апреля 2027** — итог: доля платящих через 4 месяца после подключения в каждой группе против контроля.\n- **Сразу**, если выручка опустится ниже уровня июля 2026 года, — решение пересматриваем.\n\nДо запуска теста стоит взять у аналитика отток в разрезе «акционные / неакционные». Без этих данных нельзя проверить условие пересмотра по давним клиентам.\n\n**Файлы** в `cases/family-price/`:\n- `memo.md` — записка на одну страницу;\n- `decisions.md` — журнал решения: условия пересмотра и открытые вопросы;\n- `claims.md` — все утверждения с цитатами и источниками;\n- полные документы: `options.md`, `table.md`, `product.md`, `comms.md`, `verification.md`.\n\nHTML-версии записки в этой версии нет.\n\n**Стоимость:**\n- Платные вызовы CLI — $0,00 из $5: ключа поиска нет, поиск шёл встроенным инструментом IDE, его стоимость отдельно не считается.\n- Модель IDE по журналу сессий — около $3,74. Почти половина этой суммы приходится на этап исследования.\n\nАвтоматического напоминания о датах проверки в этой версии нет. Когда появятся результаты теста или новая выгрузка, принесите их: я добавлю их в кейс и скажу, какие выводы они затрагивают.", "usd": 0.0691, "t": 1331}]}</script>
<script>
(function () {
  "use strict";
  var chat = document.getElementById("chat");
  var playBtn = document.getElementById("play");
  var speedSel = document.getElementById("speed");
  var script = null, events = [], pos = 0, playing = false, timer = null, skipping = false;
  var stepsBox = null, typing = null;

  // ---------- theme ----------
  function setTheme(t) {
    if (t) document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    try { if (t) localStorage.setItem("replay-theme", t); else localStorage.removeItem("replay-theme"); } catch (e) {}
  }
  try { var saved = localStorage.getItem("replay-theme"); if (saved) setTheme(saved); } catch (e) {}
  document.getElementById("theme").onclick = function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    setTheme(dark ? "light" : "dark");
  };

  // ---------- helpers ----------
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a target="_blank" rel="noopener noreferrer" href="$2">$1</a>');
    return s;
  }
  function markdown(text) {
    var out = [], list = null;
    function close() { if (list) { out.push("</" + list + ">"); list = null; } }
    text.split("\n").forEach(function (raw) {
      var line = raw.replace(/\s+$/, "");
      var m;
      if (!line.trim()) { close(); return; }
      if ((m = line.match(/^(\s*)[-*] (.*)$/))) {
        if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; }
        out.push('<li' + (m[1].length >= 2 ? ' class="sub"' : "") + ">" + inline(m[2]) + "</li>");
      } else if ((m = line.match(/^(\s*)\d+\. (.*)$/))) {
        if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; }
        out.push("<li>" + inline(m[2]) + "</li>");
      } else if ((m = line.match(/^#{1,6} (.*)$/))) {
        close(); out.push("<p><strong>" + inline(m[1]) + "</strong></p>");

    close();
    return out.join("");
  }
  function clock(t) {

  }
  function money(v) { return "$" + (v < 0.01 && v > 0 ? v.toFixed(3) : v.toFixed(2)); }
  function nearBottom() {

  function typeInto(node, done) {

      }

      timer = setTimeout(tick, 16);

  }
  function stepsGroup() {
    if (stepsBox) return stepsBox;
    var d = el("details", "steps");
    var s = el("summary");
    var count = el("span", "count", "Действия: 0");
    var last = el("span", "last", "");
    s.appendChild(count); s.appendChild(last);
    d.appendChild(s); d.appendChild(el("ol"));
    chat.appendChild(d);
    stepsBox = { d: d, count: count, last: last, ol: d.querySelector("ol"), n: 0, fail: 0 };
    return stepsBox;
  }
  function gateCard(title, buttons, chosen, note) {
    var g = el("div", "gate");
    g.appendChild(el("div", "title", title));
    var row = el("div", "buttons");
    (buttons || []).forEach(function (b) { row.appendChild(el("span", null, b)); });
    g.appendChild(row);
    if (note) g.appendChild(el("div", "note", note));
    chat.appendChild(g);
    return { press: function () { if (chosen != null && row.children[chosen]) row.children[chosen].classList.add("pressed"); } };
  }

  function show(ev, done) {
    if (ev.kind !== "step") stepsBox = null;
    if (ev.kind === "step") {
      var g = stepsGroup(), li = el("li", ev.ok === false ? "fail" : "");
      li.appendChild(el("span", "dot"));
      li.appendChild(el("span", "txt", ev.line));
      if (ev.usd) li.appendChild(el("span", "c", money(ev.usd)));
      g.ol.appendChild(li); g.n++; if (ev.ok === false) g.fail++;
      g.count.textContent = "Действия: " + g.n + (g.fail ? ", с ошибкой: " + g.fail : "");
      g.last.textContent = ev.line;
      follow();
      return wait(instant() ? 0 : 260, done);
    }
    if (ev.kind === "user") {
      chat.appendChild(el("div", "who right", ev.via === "button" ? "Пользователь нажал кнопку" : "Пользователь"));
      chat.appendChild(el("div", "msg user", ev.text));
      chat.appendChild(metaLine(ev, true));
      follow(true);
      return wait(instant() ? 0 : 900, done);
    }
    if (ev.kind === "question") {
      var q = gateCard("Вопрос агента: " + ev.text, ev.buttons, ev.chosen, null);
      follow(true);
      return wait(instant() ? 0 : 1400, function () { q.press(); wait(instant() ? 0 : 700, done); });
    }
    // agent
    chat.appendChild(el("div", "who", "Агент"));
    var box = el("div", "msg agent");
    box.innerHTML = markdown(ev.text);
    chat.appendChild(box);
    follow(true);
    typeInto(box, function () {
      chat.appendChild(metaLine(ev, false));
      if (!ev.gate) return wait(instant() ? 0 : 700, done);
      var gt = ev.gate;
      var card = gateCard("Гейт " + gt.n + ": агент остановился и ждёт решения пользователя",
        gt.buttons, gt.chosen,
        gt.typed ? "В записи пользователь ответил текстом; кнопки показывают смысл ответа." : null);
      follow(true);
      wait(instant() ? 0 : 1600, function () { card.press(); wait(instant() ? 0 : 800, done); });
    });
  }

  function wait(ms, fn) {
    if (!ms) { return fn(); }
    timer = setTimeout(fn, ms / (speed() === Infinity ? 1 : speed()));
  }

  // ---------- player ----------
  function progress() {
    document.getElementById("progress").textContent =
      "Событие " + pos + " из " + events.length + (pos > 0 ? " · " + clock(events[pos - 1].t || 0) : "");
    document.getElementById("bar").style.width = (events.length ? 100 * pos / events.length : 0) + "%";
  }
  function finishAll() {
    playing = false; skipping = false;
    playBtn.textContent = "Ещё раз";
    var m = script.meta || {};
    chat.appendChild(el("div", "end", "Конец записи · " + Math.round(m.minutes || 0) + " мин · " +
      (m.usd != null ? money(m.usd) : "") + " · " + (m.steps || 0) + " шагов"));
    chat.setAttribute("data-done", "1");
  }
  var guard = 0;
  function next() {
    if (!playing) return;
    if (pos >= events.length) return finishAll();
    var ev = events[pos++];
    progress();
    var stopAfter = skipping && (ev.gate || ev.kind === "question");
    show(ev, function () {
      if (stopAfter) { skipping = false; pause(); follow(true); return; }
      // break deep synchronous recursion when rendering instantly
      if (++guard % 40 === 0) { timer = setTimeout(next, 0); } else { next(); }
    });
  }
  function play() {
    if (!events.length) return;
    if (pos >= events.length) reset();
    var st = chat.querySelector(".start"); if (st) st.remove();
    playing = true; playBtn.textContent = "Пауза"; next();
  }
  function pause() {
    playing = false; clearTimeout(timer); playBtn.textContent = "Продолжить";
    if (typing) {
      // drop the half-typed message; resume types it again from the start
      typing = null;
      var box = chat.lastElementChild, who = box && box.previousElementSibling;
      if (box) box.remove();
      if (who && who.classList.contains("who")) who.remove();
      pos--; progress();
    }
  }
  function reset() {
    pause(); clearTimeout(timer); typing = null;
    chat.textContent = ""; chat.removeAttribute("data-done"); pos = 0; stepsBox = null; skipping = false;
    playBtn.textContent = "Смотреть"; progress();
  }
  playBtn.onclick = function () { if (playing) pause(); else play(); };
  speedSel.onchange = function () { if (typing && instant() && typing.finish) typing.finish(); };
  document.getElementById("skip").onclick = function () {
    if (pos >= events.length) return;
    skipping = true;
    if (typing && typing.finish) { typing.finish(); return; }
    if (!playing) play();
    else { clearTimeout(timer); next(); }
  };
  document.getElementById("restart").onclick = function () { reset(); play(); };

  function start(data) {
    script = data; events = data.events || [];
    banner(); progress();
    var hash = new URLSearchParams(location.hash.replace(/^#/, ""));
    if (hash.get("speed")) speedSel.value = hash.get("speed");
    if (hash.get("autoplay") === "1") return play();
    var s = el("div", "start", "Запись начнётся с первого сообщения пользователя.");
    var b = el("button", "primary", "Смотреть запись"); b.type = "button";
    b.onclick = function () { play(); };
    s.appendChild(el("br")); s.appendChild(b); chat.appendChild(s);
  }
  function fail(msg) { chat.appendChild(el("div", "start", msg)); }

  var embedded = null;
  try { embedded = JSON.parse(document.getElementById("replay-data").textContent); } catch (e) {}
  if (embedded && embedded.events && embedded.events.length) start(embedded);
  else fetch("script.json").then(function (r) { return r.json(); }).then(start)
    .catch(function () { fail("Не удалось загрузить script.json. Запустите bin/strat replay export."); });
})();
</script>
</body>
</html>
