# Fixed routing per step: search providers, outside models and small judgments.
search:
  # One provider per call by kind, falling through on failure; brave is the last fallback.
  # Phase 1 ships brave only; tavily and exa join after the Russian query test.
  keyword: [brave]
  text: [brave]
  semantic: [brave]
  # Price per call in USD, used for the cost log. Estimate from the vendor's pricing page
  # (about 5 USD per 1000 requests); check it there before quoting it.
  usd_per_call:
    brave: 0.005

# Outside models, called by strat/models.py (one OpenAI-compatible client). Endpoints and keys
# come from .env: STRAT_<ROLE>_BASE_URL, STRAT_<ROLE>_API_KEY, STRAT_<ROLE>_MODEL.
models:
  timeout_sec: 120
  retries: 1            # one retry, only after a timeout, a network error, 429 or 5xx
  # USD per 1M tokens, one flat rate for input and output. AnyModel prices a model as its base
  # rate (5 cents per 1M tokens) times the model's coefficient (anymodel.org/en/models/jev-1-14:
  # x10 = 0.50; /laya-multilingual: x20 = 1.00; GET /v1/models: ds/deepseek-v4-flash x0.25).
  # Read 2026-11-14.
  usd_per_mtok:
    jev/jev-1.14.0: 0.50
    jev/laya-multilingual: 1.00
    ds/deepseek-v4-flash: 0.0125
  # A model not listed above is logged with this rate and marked "estimate" in the log note.
  default_usd_per_mtok: 2.00

# strat judge: typed questions (type, support, contradiction, sufficient).
# Order: Jev (STRAT_JEV_*), then a cheap chat model on the peer endpoint (STRAT_PEER_*) with a
# fixed answer format, then the IDE agent itself (exit 3, the answer is stored with by=agent).
judge:
  # Jev model: jev/jev-1.14.0, pinned so verdicts do not move between runs. Chosen over
  # jev/laya-multilingual from the model pages only: laya refuses any question over 1,024 tokens
  # including state, instructions and labels, and a claim with its quote and the instructions
  # can pass that; jev-1.14 has 32K context and its release notes name the largest gains in
  # languages other than English. NOT compared live on Russian claims yet (no AnyModel key in
  # this build); STRAT_JEV_MODEL in .env overrides it.
  jev_model: jev/jev-1.14.0
  # Below this calibrated probability Jev's answer escalates to the main model (the IDE agent).
  # About 0.8, after the Jev paper's suggested cut-off for "is the evidence sufficient".
  threshold: 0.8
  # Chat fallback on the peer endpoint: a cheap model, since the judge needs one word back, not
  # the challenger's strong model. Empty means STRAT_PEER_MODEL. One of the cheapest paid chat
  # models in AnyModel's catalog on 2026-11-14 (x0.25); the free am/* routes were skipped as
  # less predictable for availability.
  chat_model: ds/deepseek-v4-flash
  chat_max_tokens: 800  # room for a reasoning model to think before the one answer line
