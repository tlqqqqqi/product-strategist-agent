# Fixed routing per step. Phase 1 uses only search; models and judge come in Phase 2.
search:
  # One provider per call by kind, falling through on failure; brave is always the last
  # fallback (strat/search.py moves it to the end whatever is written here).
  # Order of tavily and exa set by the Russian query test, 2026-11-14: config/search-eval.md.
  # Exa scored above Tavily on keyword and text; on semantic the heuristic favoured Tavily but a
  # result-by-result check found Exa on topic far more often, so Exa leads everywhere.
  keyword: [exa, tavily, brave]
  text: [exa, tavily, brave]
  semantic: [exa, tavily, brave]
  # Price per call in USD for the cost log, from the vendors' pricing pages, checked 2026-11-14:
  # brave  - brave.com/search/api: Search plan 5 USD per 1000 requests (5 USD free credit/month).
  # tavily - tavily.com/pricing: pay as you go 0.008 USD per credit; a basic search is 1 credit
  #          (docs.tavily.com/documentation/api-credits; a live call reported usage 1 credit).
  #          The free plan has 1000 credits/month.
  # exa    - exa.ai/pricing: /search type auto 7 USD per 1000 requests, up to 10 results;
  #          a live call with 5 results and highlights reported costDollars.total 0.007.
  usd_per_call:
    brave: 0.005
    tavily: 0.008
    exa: 0.007
