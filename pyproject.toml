[project]
name = "strategist"
version = "0.1.0"
description = "Folder agent for a product lead: claims with sources, options, strategies, gates."
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "pypdf>=5.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
strat = "strat.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["strat", "strat.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
